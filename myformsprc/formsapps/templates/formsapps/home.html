<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fa;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            text-align: center;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        }

        form {
            margin-bottom: 20px;
        }

        input[type="text"], input[type="email"], input[type="number"] {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f9f9f9;
        }

        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Forms</h1>

        <!-- 🔍 Search Form -->
        <form method="get" class="search-box">
            <input type="text" name="q" value="{{ search_query }}" placeholder="Search by name, email, roll, or subject">
            <button type="submit">Search</button>
        </form>

        <!-- ✍️ Add Student Form -->
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Submit</button>
        </form>

        <!-- 📋 Students Table -->
        <h2>All Students</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Roll</th>
                <th>Favorite Subject</th>
            </tr>
            {% for st in students %}
            <tr>
                <td>{{ st.name }}</td>
                <td>{{ st.email }}</td>
                <td>{{ st.roll }}</td>
                <td>{{ st.fav_sub }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No students found.</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
